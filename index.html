<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 de Septiembre 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo de Jardín/Bosque -->
  <div class="bosque-fondo">
    <div class="luz-sol"></div>
    <div class="arboles-lejano"></div>
    <div class="arboles-cercano"></div>
    <div class="pasto-fondo"></div>
  </div>

  <!-- Pétalos y destellos volando -->
  <div class="petalos-fondo">
    <div class="petalo-flotante"></div>
    <div class="petalo-flotante"></div>
    <div class="petalo-flotante"></div>
    <div class="petalo-flotante"></div>
    <div class="petalo-flotante"></div>
    <div class="petalo-flotante"></div>
  </div>

  <main class="contenedor">
    <header class="encabezado">
      <span class="fecha">21 DE SEPTIEMBRE</span>
      <h1>Un Jardín de Girasoles Para Ti</h1>
      <p class="subtitulo">Para la persona que ilumina cada uno de mis días</p>
    </header>

    <!-- Escena 3D del Ramo de Girasoles -->
    <div class="escena-3d">
      <div class="ramo-girasoles">
        
        <!-- Girasol Principal (Centro) -->
        <div class="girasol principal">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-izq"></div>
          <div class="hoja hoja-der"></div>
        </div>

        <!-- Girasol Izquierda -->
        <div class="girasol secundario-izq">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-izq"></div>
        </div>

        <!-- Girasol Derecha -->
        <div class="girasol secundario-der">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-der"></div>
        </div>

        <!-- Maceta del Jardín -->
        <div class="maceta">
          <div class="borde-maceta"></div>
        </div>
      </div>
      
      <div class="sombra"></div>
    </div>

    <div class="tarjeta-mensaje">
      <p>Un campo lleno de luz y detalles que nunca se marchitan, tan especial y brillante como tú. ¡Feliz 21 de septiembre!</p>
    </div>
  </main>

</body>
</html>
