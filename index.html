<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 de Septiembre - Para YHAMILE 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Control para mostrar la galería de girasoles centrados -->
  <input type="checkbox" id="activar-lluvia">

  <!-- FONDO DE JARDÍN DE DÍA -->
  <div class="jardin-dia-fondo">
    <div class="sol-dia"></div>
    <div class="nube nube1"></div>
    <div class="nube nube2"></div>
    <div class="flores-fondo"></div>
    <div class="pasto-jardin"></div>
  </div>

  <!-- GIRASOLES GIGANTES QUIETOS CON LETRAS DE YHAMILE Y TALLO -->
  <div class="galeria-girasoles-centrados">
    <div class="girasol-completo-gigante">
      <div class="flor-lluvia"><div class="centro-lluvia">Y</div></div>
      <div class="tallo-gigante"></div>
      <div class="hoja-gigante hoja-izq"></div>
    </div>
    <div class="girasol-completo-gigante">
      <div class="flor-lluvia"><div class="centro-lluvia">H</div></div>
      <div class="tallo-gigante"></div>
      <div class="hoja-gigante hoja-der"></div>
    </div>
    <div class="girasol-completo-gigante">
      <div class="flor-lluvia"><div class="centro-lluvia">A</div></div>
      <div class="tallo-gigante"></div>
      <div class="hoja-gigante hoja-izq"></div>
    </div>
    <div class="girasol-completo-gigante">
      <div class="flor-lluvia"><div class="centro-lluvia">M</div></div>
      <div class="tallo-gigante"></div>
      <div class="hoja-gigante hoja-der"></div>
    </div>
    <div class="girasol-completo-gigante">
      <div class="flor-lluvia"><div class="centro-lluvia">I</div></div>
      <div class="tallo-gigante"></div>
      <div class="hoja-gigante hoja-izq"></div>
    </div>
    <div class="girasol-completo-gigante">
      <div class="flor-lluvia"><div class="centro-lluvia">L</div></div>
      <div class="tallo-gigante"></div>
      <div class="hoja-gigante hoja-der"></div>
    </div>
    <div class="girasol-completo-gigante">
      <div class="flor-lluvia"><div class="centro-lluvia">E</div></div>
      <div class="tallo-gigante"></div>
      <div class="hoja-gigante hoja-izq"></div>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenedor">
    <header class="encabezado">
      <span class="fecha">21 DE SEPTIEMBRE</span>
      <h1>Para YHAMILE 🌻</h1>
      <p class="subtitulo">Un hermoso jardín soleado para ti</p>
    </header>

    <!-- Botón Mágico -->
    <label for="activar-lluvia" class="boton-magico">
      ✨ Mostrar los girasoles de YHAMILE ✨
    </label>

    <!-- Ramo Principal en Maceta -->
    <div class="escena-3d">
      <div class="ramo-girasoles">
        <!-- Girasol Central Grande -->
        <div class="girasol principal">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-izq"></div>
          <div class="hoja hoja-der"></div>
        </div>

        <!-- Girasol Secundario Izquierda -->
        <div class="girasol secundario-izq">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-izq"></div>
        </div>

        <!-- Girasol Secundario Derecha -->
        <div class="girasol secundario-der">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-der"></div>
        </div>

        <div class="maceta">
          <div class="borde-maceta"></div>
        </div>
      </div>
      <div class="sombra"></div>
    </div>

    <!-- Mensaje Especial -->
    <div class="tarjeta-mensaje">
      <p>Que tu día brille tan fuerte como estos girasoles bajo el sol. ¡Feliz 21 de septiembre, mi amor Yhamile!</p>
    </div>
  </main>

</body>
</html>
