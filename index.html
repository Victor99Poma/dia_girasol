<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 de Septiembre - El Jardín del Edén 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- FONDO TIPO JARDÍN DEL EDÉN -->
  <div class="eden-fondo">
    <div class="sol-mistico"></div>
    <div class="aurora-luz"></div>
    <div class="cascada-magica"></div>
    <div class="montanas-eden"></div>
    <div class="vegetacion-eden"></div>
    
    <!-- Partículas y destellos brillantes del Edén -->
    <div class="brillos-eden">
      <div class="destello d1"></div>
      <div class="destello d2"></div>
      <div class="destello d3"></div>
      <div class="destello d4"></div>
      <div class="destello d5"></div>
    </div>
  </div>

  <!-- GIRASOLES FLOTANDO Y MOVIÉNDOSE POR TODA LA PANTALLA -->
  <div class="girasoles-pantalla">
    
    <!-- Girasol Flotante 1 -->
    <div class="girasol-móvil gf1">
      <div class="flor">
        <div class="centro"></div>
        <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
        <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
        <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
        <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
      </div>
    </div>

    <!-- Girasol Flotante 2 -->
    <div class="girasol-móvil gf2">
      <div class="flor">
        <div class="centro"></div>
        <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
        <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
        <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
        <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
      </div>
    </div>

    <!-- Girasol Flotante 3 -->
    <div class="girasol-móvil gf3">
      <div class="flor">
        <div class="centro"></div>
        <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
        <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
        <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
        <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
      </div>
    </div>

    <!-- Girasol Flotante 4 -->
    <div class="girasol-móvil gf4">
      <div class="flor">
        <div class="centro"></div>
        <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
        <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
        <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
        <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
      </div>
    </div>

    <!-- Girasol Flotante 5 -->
    <div class="girasol-móvil gf5">
      <div class="flor">
        <div class="centro"></div>
        <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
        <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
        <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
        <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
      </div>
    </div>

    <!-- Girasol Flotante 6 -->
    <div class="girasol-móvil gf6">
      <div class="flor">
        <div class="centro"></div>
        <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
        <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
        <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
        <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
      </div>
    </div>

  </div>

  <!-- CONTENIDO PRINCIPAL Y CENTRO DE LA ESCENA -->
  <main class="contenedor">
    <header class="encabezado">
      <span class="fecha">21 DE SEPTIEMBRE</span>
      <h1>El Edén de tus Girasoles</h1>
      <p class="subtitulo">En un paraíso sin fin, mi regalo eterno para ti</p>
    </header>

    <!-- Ramo Principal de Girasoles con Animación 3D -->
    <div class="escena-3d">
      <div class="ramo-girasoles">
        
        <!-- Girasol Central Grande -->
        <div class="girasol principal">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-izq"></div>
          <div class="hoja hoja-der"></div>
        </div>

        <!-- Girasol Secundario Izquierda -->
        <div class="girasol secundario-izq">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-izq"></div>
        </div>

        <!-- Girasol Secundario Derecha -->
        <div class="girasol secundario-der">
          <div class="flor">
            <div class="centro"></div>
            <div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div>
            <div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div>
            <div class="petalo p7"></div><div class="petalo p8"></div><div class="petalo p9"></div>
            <div class="petalo p10"></div><div class="petalo p11"></div><div class="petalo p12"></div>
          </div>
          <div class="tallo"></div>
          <div class="hoja hoja-der"></div>
        </div>

        <div class="maceta">
          <div class="borde-maceta"></div>
        </div>
      </div>
      <div class="sombra"></div>
    </div>

    <!-- Mensaje Especial -->
    <div class="tarjeta-mensaje">
      <p>Ni todo el Jardín del Edén se compara con la luz que le das a mi vida. ¡Feliz 21 de septiembre, mi amor!</p>
    </div>
  </main>

</body>
</html>
